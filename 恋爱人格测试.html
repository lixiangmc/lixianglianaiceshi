<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>恋爱人格图鉴 · 你是哪一种爱人</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♥</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  :root{
    --bg:#FAF6F1;
    --bg-card:#FFFFFF;
    --ink:#2B1A20;
    --ink-soft:#6B5560;
    --wine:#722F37;
    --wine-deep:#4A1F26;
    --gold:#B8956A;
    --gold-light:#D4BC93;
    --rose:#C97B84;
    --line:#E8DDD3;
    --shadow:0 8px 30px rgba(74,31,38,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    overflow-x:hidden;
  }
  .serif{font-family:'Noto Serif SC',serif}

  /* ===== 视图切换 ===== */
  .view{display:none;min-height:100vh;flex-direction:column}
  .view.active{display:flex;animation:fadeIn .5s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* ===== 锁视图 ===== */
  #view-lock{
    align-items:center;justify-content:center;text-align:center;
    background:linear-gradient(160deg,#FAF6F1 0%,#F5E6E8 100%);
    padding:24px;
  }
  .lock-box{max-width:340px;width:100%}
  .lock-icon{
    width:72px;height:72px;margin:0 auto 24px;border-radius:50%;
    background:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 30px rgba(114,47,55,.12);
  }
  .lock-title{
    font-size:22px;font-weight:700;color:var(--ink);margin-bottom:8px;
  }
  .lock-sub{font-size:13px;color:var(--ink-soft);margin-bottom:28px}
  .lock-input{
    width:100%;padding:16px 20px;border:1.5px solid var(--line);
    border-radius:14px;font-size:18px;text-align:center;
    letter-spacing:.3em;text-transform:uppercase;
    background:#fff;color:var(--wine);font-weight:600;
    outline:none;transition:border-color .2s;
    font-family:'Noto Sans SC',sans-serif;
  }
  .lock-input:focus{border-color:var(--wine)}
  .lock-btn{width:100%;margin-top:14px;letter-spacing:.2em}
  .lock-error{
    color:#c0392b;font-size:13px;margin-top:14px;
  }

  /* ===== 首页 ===== */
  #view-home{
    position:relative;
    background:
      linear-gradient(180deg,rgba(250,246,241,0) 50%,rgba(74,31,38,.55) 100%),
      url('assets/xiaohongshu-cover.jpg') center/cover no-repeat;
    color:var(--ink);
    justify-content:flex-end;
    padding:0 28px 50px;
  }
  .home-tag{display:none}
  .home-title{display:none}
  .home-sub{
    font-size:15px;line-height:1.8;color:#fff;
    max-width:340px;margin-bottom:28px;font-weight:400;
    text-shadow:0 1px 6px rgba(43,26,32,.5);
  }
  .btn-primary{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--wine);color:#fff;border:none;
    padding:18px 40px;border-radius:60px;
    font-size:16px;font-weight:500;letter-spacing:.1em;
    cursor:pointer;transition:transform .2s,box-shadow .2s;
    box-shadow:0 8px 24px rgba(114,47,55,.35);
    font-family:'Noto Sans SC',sans-serif;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(114,47,55,.45)}
  .btn-ghost{
    background:transparent;color:var(--ink);
    border:1px solid var(--line);
  }
  .home-meta{
    margin-top:20px;font-size:12px;color:#fff;letter-spacing:.1em;
    text-shadow:0 1px 4px rgba(43,26,32,.6),0 0 2px rgba(43,26,32,.5);
  }

  /* ===== 测试页 ===== */
  #view-quiz{padding:0;background:var(--bg)}
  .quiz-top{
    padding:20px 24px 12px;
    position:sticky;top:0;background:var(--bg);z-index:10;
  }
  .quiz-progress-row{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
  }
  .quiz-count{font-size:13px;color:var(--ink-soft);letter-spacing:.1em}
  .quiz-count b{color:var(--wine);font-weight:700;font-size:16px}
  .quiz-bar{
    height:3px;background:var(--line);border-radius:2px;overflow:hidden;
  }
  .quiz-bar-fill{
    height:100%;background:linear-gradient(90deg,var(--wine),var(--rose));
    width:0%;transition:width .4s ease;border-radius:2px;
  }
  .quiz-body{padding:20px 24px 40px;flex:1}
  .quiz-q{
    font-family:'Noto Serif SC',serif;
    font-size:24px;font-weight:700;line-height:1.4;
    margin:24px 0 32px;color:var(--ink);
  }
  .quiz-opts{display:flex;flex-direction:column;gap:14px}
  .opt{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 20px;
    font-size:15px;line-height:1.6;
    cursor:pointer;transition:all .2s;
    display:flex;gap:14px;align-items:flex-start;
    color:var(--ink);text-align:left;width:100%;
    font-family:'Noto Sans SC',sans-serif;
  }
  .opt:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:var(--shadow)}
  .opt.selected{border-color:var(--wine);background:#FBF3F0}
  .opt-letter{
    flex-shrink:0;width:28px;height:28px;border-radius:50%;
    background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;color:var(--ink-soft);
    font-family:'Noto Serif SC',serif;
  }
  .opt.selected .opt-letter{background:var(--wine);color:#fff;border-color:var(--wine)}
  .quiz-nav{margin-top:24px;display:flex;justify-content:flex-start}
  .btn-back{
    background:transparent;color:var(--ink-soft);
    border:1px solid var(--line);padding:10px 22px;border-radius:30px;
    font-size:13px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;
    transition:all .2s;
  }
  .btn-back:hover{border-color:var(--wine);color:var(--wine)}

  /* ===== 加载页 ===== */
  #view-loading{
    align-items:center;justify-content:center;text-align:center;
    background:var(--bg);padding:24px;
  }
  .loading-heart{
    width:60px;height:60px;margin:0 auto 24px;position:relative;
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.15)}
  }
  .loading-title{
    font-family:'Noto Serif SC',serif;font-size:22px;font-weight:700;
    margin-bottom:12px;color:var(--wine);
  }
  .loading-sub{font-size:14px;color:var(--ink-soft);max-width:280px;line-height:1.8}
  .loading-dots::after{
    content:'';animation:dots 1.5s steps(4) infinite;
  }
  @keyframes dots{
    0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}
  }

  /* ===== 结果页 ===== */
  #view-result{padding:0;background:var(--bg)}
  .result-hero{
    position:relative;height:60vh;min-height:420px;overflow:hidden;
  }
  .result-hero img{
    width:100%;height:100%;object-fit:cover;object-position:center;
  }
  .result-hero::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(43,26,32,.1) 0%,rgba(43,26,32,.75) 100%);
  }
  .result-badge{
    position:absolute;top:20px;left:20px;z-index:2;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    padding:6px 14px;border-radius:30px;font-size:12px;
    color:var(--wine);letter-spacing:.15em;font-weight:500;
  }
  .result-body{
    margin-top:-40px;position:relative;z-index:3;
    background:var(--bg);border-radius:28px 28px 0 0;
    padding:32px 28px 60px;
  }
  .result-type{
    font-size:12px;letter-spacing:.3em;color:var(--gold);
    text-transform:uppercase;margin-bottom:10px;font-weight:500;
  }
  .result-name{
    font-family:'Noto Serif SC',serif;
    font-size:36px;font-weight:900;line-height:1.2;
    color:var(--ink);margin-bottom:8px;
  }
  .result-en{
    font-family:'Noto Serif SC',serif;
    font-size:14px;color:var(--ink-soft);font-style:italic;
    margin-bottom:20px;letter-spacing:.05em;
  }
  .result-quote{
    font-family:'Noto Serif SC',serif;
    font-size:18px;line-height:1.7;color:var(--wine);
    padding:20px 22px;background:#FBF3F0;border-radius:14px;
    border-left:3px solid var(--gold);margin-bottom:28px;
    font-weight:600;
  }
  .result-desc h3{
    font-family:'Noto Serif SC',serif;font-size:16px;
    color:var(--ink);margin:24px 0 10px;font-weight:700;
  }
  .result-desc p{font-size:14px;line-height:1.9;color:var(--ink-soft);margin-bottom:12px}
  .result-tags{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
  .rtag{
    padding:6px 14px;border-radius:20px;background:var(--bg);
    border:1px solid var(--line);font-size:12px;color:var(--ink-soft);
  }
  .result-dims{
    margin:24px 0;padding:20px;background:var(--bg-card);
    border-radius:16px;border:1px solid var(--line);
  }
  .dim-row{margin-bottom:14px}
  .dim-row:last-child{margin-bottom:0}
  .dim-label{
    display:flex;justify-content:space-between;font-size:12px;
    color:var(--ink-soft);margin-bottom:6px;letter-spacing:.05em;
  }
  .dim-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
  .dim-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--wine));border-radius:2px}
  .result-actions{
    display:flex;flex-direction:column;gap:12px;margin-top:32px;
  }
  .btn-share{
    background:var(--wine);color:#fff;border:none;
    padding:16px;border-radius:60px;font-size:15px;
    font-weight:500;letter-spacing:.1em;cursor:pointer;
    font-family:'Noto Sans SC',sans-serif;
  }
  .btn-retake{
    background:transparent;color:var(--ink-soft);
    border:1px solid var(--line);padding:14px;border-radius:60px;
    font-size:14px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;
  }

  /* ===== 桌面端适配 ===== */
  @media (min-width:768px){
    #view-home{padding:0 80px 100px;align-items:flex-start;justify-content:flex-end}
    .home-title{font-size:64px;max-width:600px}
    .home-sub{font-size:17px;max-width:420px}
    .quiz-body{max-width:680px;margin:0 auto;width:100%}
    .quiz-q{font-size:30px}
    .opt{padding:22px 24px;font-size:16px}
    .result-body{max-width:680px;margin:-40px auto 0;border-radius:28px 28px 0 0}
    .result-name{font-size:48px}
    .result-hero{max-width:680px;margin:0 auto}
    #view-result{background:linear-gradient(180deg,var(--wine-deep) 0%,var(--bg) 30%)}
  }
</style>
</head>
<body>

<!-- ===== 视图：口令锁 ===== -->
<section id="view-lock" class="view active">

    <button class="btn-primary lock-btn" onclick="unlock()">进入测试</button>

</section>

<!-- ===== 视图：首页 ===== -->
<section id="view-home" class="view">

<!-- ===== 视图：测试 ===== -->
<section id="view-quiz" class="view">

      <button class="btn-back" id="btn-back" onclick="goBack()" style="visibility:hidden">上一步</button>
    </div>
  </div>
</section>

<!-- ===== 视图：加载 ===== -->
<section id="view-loading" class="view">
  <svg class="loading-heart" viewBox="0 0 24 24" fill="#722F37">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>

  <div class="loading-title">正在解析你的恋爱人格</div>

</section>

<section id="view-result" class="view">
  <div class="result-hero">
    <img id="r-img" src="" alt="人格图">
    <div class="result-badge">YOUR LOVE PERSONALITY</div>

  <div class="result-body">
    <div class="result-type" id="r-type">TYPE 01 / 10</div>

    <div class="result-quote serif" id="r-quote"></div>
    <div class="result-tags" id="r-tags"></div>
    <div class="result-desc">
      <h3>你在爱里的样子</h3>
      <p id="r-desc1"></p>
      <h3>恋爱中的致命吸引力</h3>
      <p id="r-desc2"></p>
      <h3>需要小心的陷阱</h3>
      <p id="r-desc3"></p>
    </div>
    <div class="result-dims" id="r-dims"></div>
    <div class="result-actions">
      <button class="btn-share" onclick="shareResult()">保存我的人格卡 · 分享</button>
      <button class="btn-retake" onclick="retake()">重新测一次</button>
    </div>
  </div>
</section>

function unlock(){
  const val = document.getElementById('lock-input').value.trim().toUpperCase();
  if(VALID_CODES.has(val)){
    // 设备绑定：把口令存在localStorage，这台设备以后免密
    localStorage.setItem('love_code', val);
    localStorage.setItem('love_unlocked', '1');
    showView('view-home');
  } else {
    document.getElementById('lock-error').style.display = 'block';
    document.getElementById('lock-input').style.borderColor = '#c0392b';
  }
}
// 回车提交
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('lock-input').addEventListener('keydown',function(e){
    if(e.key==='Enter') unlock();
  });
  // 已解锁的设备直接进首页
  if(localStorage.getItem('love_unlocked')==='1'){
    showView('view-home');
  }
});

    ["书，需要慢慢读才懂",0,-1,0,1,"soul","island"]
  ]}
];

// ===== 状态 =====
let currentQ = 0;
let scores = {A:0, E:0, S:0, I:0};
let persScores = {};
let answers = []; // 记录每题选了哪个选项index

function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function startQuiz(){
  currentQ = 0;
  scores = {A:0, E:0, S:0, I:0};
  persScores = {};
  answers = [];
  showView('view-quiz');
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[currentQ];
  document.getElementById('q-num').textContent = currentQ+1;
  document.getElementById('q-category').textContent = q.cat;
  document.getElementById('q-bar').style.width = (currentQ/QUESTIONS.length*100)+'%';
  document.getElementById('q-text').textContent = q.q;
  // 第一题隐藏上一步按钮
  document.getElementById('btn-back').style.visibility = currentQ===0 ? 'hidden' : 'visible';
  const box = document.getElementById('q-opts');
  box.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="opt-letter">'+letters[i]+'</span><span>'+opt[0]+'</span>';
    // 如果这题之前选过，恢复选中状态
    if(answers[currentQ] === i) btn.classList.add('selected');
    btn.onclick = ()=>selectOption(i);
    box.appendChild(btn);
  });
}

function selectOption(idx){
  // 如果是修改答案，先回退这题之前的选择
  if(answers[currentQ] !== undefined){
    const prev = QUESTIONS[currentQ].opts[answers[currentQ]];
    scores.A -= prev[1]; scores.E -= prev[2];
    scores.S -= prev[3]; scores.I -= prev[4];
    persScores[prev[5]] -= 2;
    persScores[prev[6]] -= 1;
  }
  const opt = QUESTIONS[currentQ].opts[idx];
  scores.A += opt[1];
  scores.E += opt[2];
  scores.S += opt[3];
  scores.I += opt[4];
  const pMain = opt[5], pSub = opt[6];
  persScores[pMain] = (persScores[pMain] || 0) + 2;
  persScores[pSub] = (persScores[pSub] || 0) + 1;
  answers[currentQ] = idx;
  event.currentTarget.classList.add('selected');
  setTimeout(()=>{
    currentQ++;
    if(currentQ >= QUESTIONS.length){
      showResult();
    } else {
      renderQuestion();
    }
  }, 280);
}

function goBack(){
  if(currentQ === 0) return;
  currentQ--;
  // 不回退分数：用户改选时 selectOption 会统一处理旧答案回退
  // answers 保留，这样回到这题时能看到之前选的选项是高亮的
  renderQuestion();
}

// 维度条显示用的归一化（基于实际分数范围）
function normDim(v, mn, mx){
  let n = (v - mn) / (mx - mn) * 100;
  return Math.max(10, Math.min(95, Math.round(n)));
}

function calculateResult(){
  // 人格判定：取直选计数最高的
  let best = null, bestScore = -1;
  for(const key in persScores){
    if(persScores[key] > bestScore){
      bestScore = persScores[key];
      best = key;
    }
  }
  // 兜底：如果所有人格都是0（不应该发生），默认radar
  if(!best) best = "radar";
  // 维度条显示
  const user = {
    A: normDim(scores.A, -5, 16),
    E: normDim(scores.E, -9, 18),
    S: normDim(scores.S, -16, 14),
    I: normDim(scores.I, -6, 18)
  };
  return {key:best, user:user};
}

function showResult(){
  showView('view-loading');
  setTimeout(()=>{
    const {key, user} = calculateResult();
    const p = PERSONALITIES[key];
    document.getElementById('r-img').src = p.img;
    document.getElementById('r-type').textContent = p.type;
    document.getElementById('r-name').textContent = p.name;
    document.getElementById('r-en').textContent = p.en;
    document.getElementById('r-quote').textContent = '"'+p.quote+'"';
    document.getElementById('r-desc1').textContent = p.desc1;
    document.getElementById('r-desc2').textContent = p.desc2;
    document.getElementById('r-desc3').textContent = p.trap;
    // tags
    const tagBox = document.getElementById('r-tags');
    tagBox.innerHTML = '';
    p.tags.forEach(t=>{
      const s = document.createElement('span');
      s.className = 'rtag'; s.textContent = t;
      tagBox.appendChild(s);
    });
    // dims
    const dims = [
      ['主动度', user.A],
      ['表达力', user.E],
      ['安全感', user.S],
      ['独立度', user.I]
    ];
    const dBox = document.getElementById('r-dims');
    dBox.innerHTML = '<div style="font-size:12px;color:var(--ink-soft);letter-spacing:.15em;margin-bottom:14px">你的恋爱维度</div>';
    dims.forEach(d=>{
      const row = document.createElement('div');
      row.className = 'dim-row';
      row.innerHTML = '<div class="dim-label"><span>'+d[0]+'</span><span>'+d[1]+'</span></div><div class="dim-bar"><div class="dim-fill" style="width:'+d[1]+'%"></div></div>';
      dBox.appendChild(row);
    });
    showView('view-result');
  }, 1800);
}

function retake(){ startQuiz(); }

function shareResult(){
  alert('长按截图这张结果页，分享到小红书/朋友圈吧～');
}
</script>
